# giode.toml configures how the giode CLI builds MiddleMan.
# Reference: https://github.com/xmhrnx/giode-cli#giodetoml

[app]
name = "MiddleMan"
id = "com.middlelan.app"
version = "1.0.0"
build = 1
icon = "assets/icon.png"
package = "."
platforms = ["windows", "macos", "linux", "android", "ios"]
publisher = "MiddleMan"
description = "See which apps use your network, where they connect, and every device on your LAN."
website = "https://github.com/xmhrnx/middlelan"
# Fills the screen until the first frame (Android's splash screen): the
# icon's graphite instead of white, in light and dark mode alike.
splash_color = "#111112"

[android]
min_sdk = 23                 # NetworkStatsManager (per-app usage) needs Android 6
target_sdk = 35
# Adaptive icon: a full-bleed background layer and a foreground kept inside
# the 66dp safe zone, so launchers never draw a white frame around it.
icon_foreground = "assets/android-foreground.png"
icon_background = "assets/android-background.png"
icon_monochrome = "assets/android-monochrome.png"
permissions = [
  "network",
  "networkstate",
  "android.permission.ACCESS_WIFI_STATE",
  "android.permission.CHANGE_WIFI_MULTICAST_STATE",   # mDNS / Bonjour discovery
  "android.permission.PACKAGE_USAGE_STATS",           # per-app traffic (granted in Settings → Usage access)
]
keep_alive = true            # foreground service for background monitoring
java = ["android/java"]      # NetStats, Wi-Fi, widget, permission and VPN helpers
# Manifest entries and resources giode doesn't generate (home screen widget,
# location permission prompt). Rebuild with android/aar/build-aar.sh.
libraries = ["android/libs/middlelan.aar"]
# keystore = "release.keystore"   # created by giode keystore; signs giode build -release

[ios]
min_os = 15
# Opaque and full-bleed: iOS rounds the corners and would show
# transparent pixels white.
icon = "assets/ios-icon.png"
[ios.usage]
# Asked before the device scan, ping and port scan reach the local network.
local_network = "MiddleMan finds the devices on your network and tests their connections."

[macos]
min_os = 11
# identity = "Developer ID Application: Your Name (TEAMID)"
# notary_id = "you@example.com"
# notary_team_id = "TEAMID"

[windows]
arch = "amd64"

[windows.installer]
desktop_shortcut = true
# per_machine = true

[windows.msix]
# The signing certificate's subject (or the Partner Center publisher ID for
# the Microsoft Store); must match the certificate that signs the package.
publisher = "CN=MiddleMan"
startup_task = true          # lets "Start in the tray when I log in" work in the MSIX

[windows.signing]
# certificate = "codesign.pfx"
# timestamp = "http://timestamp.digicert.com"

[linux]
categories = ["Network", "Monitor", "Utility"]
license = "Apache-2.0"
